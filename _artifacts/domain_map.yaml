library:
  name: 'agnostic-query'
  version: '1.7.0'
  repository: 'https://github.com/Nahida-aa/agnostic-query'
  description: 'Portable QuerySchema bridge between TanStack DB (client) and Drizzle/Kysely/SQL (server)'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'Build and compose queries'
    slug: 'query-building'
    description: 'Constructing portable QuerySchema objects using the aq builder and WHERE system'

  - name: 'Translate between ORMs'
    slug: 'adapters'
    description: 'Converting QuerySchema to/from Drizzle, Kysely, TanStack DB, db0, and raw SQL'

skills:
  - name: 'Build a query'
    slug: 'query'
    domain: 'query-building'
    description: 'Construct a portable QuerySchema with the aq builder, WHERE conditions, ordering, pagination, and runtime validation'
    type: 'core'
    covers:
      - 'aq builder'
      - '.where() — field comparison, callback, raw object'
      - '.orderBy() — single and chained ordering'
      - '.limit() / .offset() — pagination'
      - '.toJSON() — serialize to portable format'
      - 'and / or / not — logical nesting'
      - 'newWhere / newComparisonWhere — standalone WHERE builders'
      - 'createExpr — expression builder for callbacks'
      - 'createQuerySchema — Zod/Valibot runtime validation'
    tasks:
      - 'Build a typed query from scratch'
      - 'Add WHERE conditions with comparison operators'
      - 'Nest conditions with and/or/not'
      - 'Order, limit, and offset results'
      - 'Validate a QuerySchema at runtime'
      - 'Use the standalone WHERE builder for complex filtering'
    failure_modes:
      - mistake: 'Constructing QueryWhere objects directly'
        mechanism: 'Hand-written QueryWhere objects bypass TypeScript field path validation. The aq builder or newComparisonWhere enforces correct field names and value types.'
        wrong_pattern: |-
          const schema: QuerySchema<User> = {
            where: { field: ['name'], op: 'eq', value: 'Alice' },
          }
        correct_pattern: |-
          const schema = aq<User>().where('name', 'eq', 'Alice').toJSON()
        source: 'maintainer interview'
        priority: 'HIGH'
        status: 'active'
        skills:
          - 'query'
          - 'adapters'
      - mistake: 'Assuming adapter dependencies are installed'
        mechanism: 'All peer dependencies (zod, valibot, drizzle-orm, kysely, @tanstack/db, db0) are optional. Importing an adapter without installing its peer dep causes a runtime error.'
        wrong_pattern: |-
          import { toDrizzle } from 'agnostic-query/drizzle/pg'
          // Error: drizzle-orm not installed
        correct_pattern: |-
          // Install the peer dep first
          bun add drizzle-orm
        source: 'package.json peerDependenciesMeta'
        priority: 'MEDIUM'
        status: 'active'
        skills:
          - 'adapters'

  - name: 'Translate between ORMs'
    slug: 'adapters'
    domain: 'adapters'
    description: 'Convert a QuerySchema to/from Drizzle, Kysely, TanStack DB, db0, or raw SQL using tree-shakeable adapters'
    type: 'core'
    covers:
      - 'toDrizzle / toDrizzleWhere / toDrizzleOrderBy'
      - 'fromTanDbWhere / fromTanDbOrderBy / fromTanDb'
      - 'toKyselyWhere / toKyselyOrderBy / fromKysely'
      - 'toDb0Where / toDb0OrderBy / toDb0'
      - 'toSql / toSqlWhere / toSqlOrderBy'
    tasks:
      - 'Execute a QuerySchema via Drizzle on the server'
      - 'Translate TanStack DB LoadSubsetOptions into QuerySchema'
      - 'Convert a Kysely query to portable QuerySchema'
      - 'Execute a QuerySchema via db0'
      - 'Generate raw SQL strings from a QuerySchema'
    subsystems:
      - name: 'Drizzle adapter'
        config_surface: 'pg adapter — toDrizzle, toDrizzleWhere, toDrizzleOrderBy'
      - name: 'Kysely adapter'
        config_surface: 'pg adapter — fromKysely, toKyselyWhere, toKyselyOrderBy'
      - name: 'TanStack DB adapter'
        config_surface: 'fromTanDbWhere, fromTanDbOrderBy, fromTanDb'
      - name: 'db0 adapter'
        config_surface: 'toDb0Where, toDb0OrderBy, toDb0'
      - name: 'Raw SQL adapter'
        config_surface: 'toSql, toSqlWhere, toSqlOrderBy'

tensions:
  - name: 'Type safety vs. quick prototyping'
    skills: ['query', 'adapters']
    description: 'The aq builder enforces full type safety, but developers in a hurry may construct raw QueryWhere objects which bypass type checks'
    implication: 'AI agents default to raw object construction when the builder API seems verbose; always use the builder pattern'

cross_references:
  - from: 'query'
    to: 'adapters'
    reason: 'A constructed QuerySchema is nearly always consumed by an adapter — loading adapters alongside query-building ensures the developer sees the full pipeline'
  - from: 'adapters'
    to: 'query'
    reason: 'When translating from TanStack DB or Kysely, understanding how QuerySchema is structured helps debug unexpected conversions'

gaps: []
