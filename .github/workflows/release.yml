name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run type assertions (tsd)
        run: bunx tsd
        working-directory: packages/agnostic-query
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage || [ $? -eq 99 ]
        working-directory: packages/agnostic-query
      - uses: codecov/codecov-action@v5
        with:
          directory: packages/agnostic-query/coverage
          fail_ci_if_error: false
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: changesets/action@v1
        with:
          version: bun x changeset version
          publish: bun x changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}