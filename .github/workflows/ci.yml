name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install
      - name: Run runtime tests
        run: bun test --silent
        working-directory: packages/agnostic-query
      - name: Run type assertions (tsd)
        run: bunx tsd
        working-directory: packages/agnostic-query
