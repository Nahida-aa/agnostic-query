name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install
      - name: Run runtime tests
        working-directory: packages/agnostic-query
        run: |
          set +e
          bun test --silent
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 99 ]; then
            exit "$rc"
          fi
      - name: Run type assertions (tsd)
        run: bunx tsd
        working-directory: packages/agnostic-query
